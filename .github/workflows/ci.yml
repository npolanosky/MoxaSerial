name: CI

# Lint and test on every push to main and every PR against it. The add-in is
# stdlib-only and everything below moxaserial/ui/ is Fusion-free, so the whole
# suite runs in a plain CPython on a plain Ubuntu runner -- no Fusion, no
# hardware.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Fusion embeds CPython 3.12; test against the same minor version.
          python-version: "3.12"

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: ruff check
        run: ruff check .

      - name: pytest
        run: pytest -q

      - name: Payload list is complete and buildable
        run: |
          python tools/make_release_zip.py --check-manifest
          python install.py --dest "$RUNNER_TEMP/addins" --dry-run

  installers:
    name: installer sanity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install.py installs into a scratch AddIns folder
        shell: bash
        run: |
          set -euo pipefail
          python install.py --dest "$RUNNER_TEMP/addins"
          test -f "$RUNNER_TEMP/addins/MoxaSerial/MoxaSerial.manifest"
          test -f "$RUNNER_TEMP/addins/MoxaSerial/moxaserial/ui/app.py"
          test -f "$RUNNER_TEMP/addins/MoxaSerial/resources/palette/index.html"
          # A second run must back the first one up rather than merge into it.
          python install.py --dest "$RUNNER_TEMP/addins"
          ls -d "$RUNNER_TEMP/addins/MoxaSerial.bak-"* >/dev/null
          python install.py --uninstall --dest "$RUNNER_TEMP/addins"
          test ! -e "$RUNNER_TEMP/addins/MoxaSerial"

      - name: install.ps1 parses and installs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Syntax check first: a parse error here is the failure mode we cannot
          # reproduce anywhere else in CI.
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              "installers/windows/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

          $dest = Join-Path $env:RUNNER_TEMP 'addins-ps'
          & ./installers/windows/install.ps1 -Dest $dest
          if (-not (Test-Path (Join-Path $dest 'MoxaSerial\moxaserial\ui\app.py'))) {
              throw 'install.ps1 did not copy the package'
          }
          & ./installers/windows/install.ps1 -Dest $dest   # must back up, not merge
          if (-not (Get-ChildItem -Path $dest -Filter 'MoxaSerial.bak-*')) {
              throw 'install.ps1 did not back up the previous install'
          }
          & ./installers/windows/install.ps1 -Dest $dest -Uninstall
          if (Test-Path (Join-Path $dest 'MoxaSerial')) { throw 'uninstall left the folder behind' }

      - name: pkg builds and installs into a home directory (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          installers/macos/build_pkg.sh --out-dir "$RUNNER_TEMP/dist"
          VERSION=$(python tools/make_release_zip.py --print-version)
          PKG="$RUNNER_TEMP/dist/MoxaSerial-$VERSION.pkg"
          # No sudo: a home-relative package installs into the current user's home.
          installer -pkg "$PKG" -target CurrentUserHomeDirectory
          TARGET="$HOME/Library/Application Support/Autodesk/Autodesk Fusion 360/API/AddIns/MoxaSerial"
          test -f "$TARGET/MoxaSerial.manifest"
          test -f "$TARGET/moxaserial/ui/app.py"
          test -f "$TARGET/resources/palette/index.html"
          echo "pkg installed $(find "$TARGET" -type f | wc -l | tr -d ' ') files into $TARGET"

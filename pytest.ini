[pytest]
# The engine tests drive real threads and real timeouts against FakeTransport,
# so the suite takes ~35 s. Everything is hermetic: conftest redirects settings
# and logs into a temp dir via MOXASERIAL_DATA_DIR.
testpaths = tests
python_files = test_*.py
addopts = -ra
filterwarnings =
    error::DeprecationWarning
